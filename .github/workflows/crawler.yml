# Scheduled crawl into Neon. Needs the repository secret DATABASE_URL
# (GitHub -> Settings -> Secrets and variables -> Actions).
# Note: GitHub only runs `schedule` (and shows the "Run workflow" button) for workflow files
# on the default branch, so this starts running once the crawler is merged into main.
name: crawler

on:
  schedule:
    - cron: "15 */3 * * *"          # every 3 hours (~1,000 Actions minutes/month on a private repo)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new pages per source"
        default: "15"

concurrency:                         # never two Actions crawls at once (Neon advisory lock covers the laptop)
  group: crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-crawler.txt

      - name: Install
        run: pip install -r requirements-crawler.txt

      - name: "Unit tests (Neon tests skip here: no DATABASE_URL in this step)"
        run: python -m pytest tests/crawler -q

      - name: Crawl into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: "T20NewsIntelBot/0.1 (academic project; +https://github.com/${{ github.repository }})"
        shell: bash                    # bash + pipefail: a failed crawl still fails the job through tee
        run: |
          mkdir -p data
          python -m src.crawler.crawl --store neon --limit ${{ github.event.inputs.limit || '15' }} --days 3 2>&1 | tee data/crawl-output.txt

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-run-${{ github.run_id }}
          path: data/
          retention-days: 7
          if-no-files-found: ignore
